<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d14" />
    <script>
      let storedTheme = null;
      try { storedTheme = localStorage.getItem("mdc-theme"); } catch {}
      const initialTheme = storedTheme === "light" || storedTheme === "dark"
        ? storedTheme
        : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = initialTheme;
      document.querySelector('meta[name="theme-color"]').content =
        initialTheme === "light" ? "#edf2f8" : "#090d14";
    </script>
    <meta
      name="description"
      content="MathDoc — a DAG workspace for formal mathematics: write, link, and organize lemmas across text, LaTeX, Python, Lean, and Rocq."
    />
    <title>MathDoc</title>
    <link rel="icon" type="image/svg+xml" href="/mdc-logo.svg" />

    <link rel="stylesheet" crossorigin href="/assets/index-CGPzmui3.css">
  </head>

  </body>
</html>
