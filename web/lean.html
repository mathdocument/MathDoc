<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lean editor</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: #181a20; color: #ddd; font: 13px system-ui; }
      #layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); height: 100%; }
      #editor, #infoview { min-width: 0; height: 100%; overflow: hidden; }
      #infoview { border-left: 1px solid #454854; }
      #infoview iframe { width: 100%; height: 100%; border: 0; }
      #error { position: fixed; bottom: 0; margin: 0; color: #ffb4ab; background: #251b1b; max-width: 100%; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main id="layout"><div id="editor" aria-label="Lean source"></div><div id="infoview" aria-label="Lean goals and messages"></div></main>
    <pre id="error" role="alert"></pre>
    <script type="module" src="/src/lean-editor.ts"></script>
  </body>
</html>
