[package]
name = "mathdoc"
version = "0.5.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "mdc"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
thiserror = "2"
anyhow = "1"
libc = "0.2"
toml = "0.8"
which = "6"
sha2 = "0.10"
dialoguer = "0.12.0"
ratatui = "0.29"
crossterm = "0.28"
# Web frontend (mdc serve)
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "macros", "tower-log", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs"] }
tower = { version = "0", features = ["util"] }
tower-http = { version = "0", features = ["fs"] }
rust-embed = "8"
mime_guess = "2"
open = "5"
tempfile = "3"

[features]
# Serve built frontend assets from web/dist via tower-http during development.
# When disabled, rust-embed embeds web/dist at compile time.
dev-web = []

[dev-dependencies]
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
