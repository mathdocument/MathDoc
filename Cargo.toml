[package]
name = "mathdoc"
version = "0.5.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "mdc"
path = "src/main.rs"

[[bench]]
name = "backend"
harness = false

[dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
thiserror = "2"
anyhow = "1"
libc = "0.2"
toml = "0.8"
which = "6"
sha2 = "0.10"
dialoguer = { version = "0.12.0", default-features = false }
ratatui = "0.29"
# Web frontend (mdc serve)
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
rust-embed = { version = "8", features = ["mime-guess"] }
tempfile = "3"

[dev-dependencies]
tower = { version = "0", default-features = false, features = ["util"] }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
