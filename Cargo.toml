[package]
name = "mathdoc"
version = "0.5.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "mdc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
libc = "0.2"
toml = "0.8"
sha2 = "0.10"
# Web frontend (mdc start)
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "process", "io-util", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Reuse the HTTP stack's native upgrade tunnel for Lean WebSockets.
hyper = { version = "1", features = ["http1"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }
tempfile = "3"

[dev-dependencies]
tower = { version = "0", default-features = false, features = ["util"] }
