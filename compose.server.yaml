# The MathDoc server: TerminusDB (documents), PostgreSQL (collaboration), the API process
# and the background worker. LeanGround runs elsewhere: set LEANGROUND_SERVER_URL.
name: mathdoc-server
x-mathdoc: &mathdoc
  build: .
  image: mathdoc-runtime:local
  init: true
  restart: unless-stopped
  environment: &mathdoc-env
    MDC_DATABASE_URL: postgresql://mathdoc:${MDC_POSTGRES_PASSWORD:?Set MDC_POSTGRES_PASSWORD in .env}@postgres:5432/mathdoc
    MDC_TERMINUS_URL: http://terminusdb:6363
    MDC_TERMINUS_PASSWORD: ${MDC_TERMINUS_PASSWORD:?Set MDC_TERMINUS_PASSWORD in .env}
    MDC_ACTORS: ${MDC_ACTORS:?Set MDC_ACTORS in .env}
    MDC_PORT: ${MDC_PORT:-17843}
    MDC_PUBLIC_ORIGIN: ${MDC_PUBLIC_ORIGIN:-}
    LEANGROUND_SERVER_URL: ${LEANGROUND_SERVER_URL:?Set LEANGROUND_SERVER_URL in .env}
    LEANGROUND_FACT_TOKEN: ${LEANGROUND_FACT_TOKEN:?Set LEANGROUND_FACT_TOKEN in .env}
    LEANGROUND_ACTOR: ${LEANGROUND_ACTOR:?Set LEANGROUND_ACTOR in .env}
  logging:
    driver: local
services:
  terminusdb:
    image: terminusdb/terminusdb-server@sha256:385faf298ad77aaf2d4d6df5e84a4cbe3596d01dab2e3b991af905639ae56388
    restart: unless-stopped
    environment:
      TERMINUSDB_ADMIN_PASS: ${MDC_TERMINUS_PASSWORD:?Set MDC_TERMINUS_PASSWORD in .env}
      TERMINUSDB_SERVER_PORT: "6363"
    volumes:
      - terminus-data:/app/terminusdb/storage
    healthcheck:
      test: ["CMD", "swipl", "-q", "-g", "use_module(library(http/http_open)),setup_call_cleanup(http_open('http://127.0.0.1:6363/api/ok', S, [timeout(5)]),read_string(S,_,_),close(S)),halt", "-t", "halt(1)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging:
      driver: local
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: mathdoc
      POSTGRES_DB: mathdoc
      POSTGRES_PASSWORD: ${MDC_POSTGRES_PASSWORD:?Set MDC_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mathdoc", "-d", "mathdoc"]
      interval: 5s
      timeout: 5s
      retries: 24
    logging:
      driver: local
  migrate:
    <<: *mathdoc
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  mdc:
    <<: *mathdoc
    command: ["serve"]
    stop_grace_period: 30s
    depends_on:
      terminusdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MDC_PORT:-17843}:${MDC_PORT:-17843}"
    volumes:
      - mdc-cache:/var/lib/mdc/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.MDC_PORT+'/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    <<: *mathdoc
    command: ["worker"]
    stop_grace_period: 30s
    depends_on:
      terminusdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  terminus-data:
  postgres-data:
  mdc-cache:
