name: mathdoc-coordination
x-coordination: &coordination
  build: .
  image: mathdoc-coordination:local
  init: true
  environment: &environment
    MDC_DATABASE_URL: postgresql://mathdoc:${MDC_POSTGRES_PASSWORD:?Set MDC_POSTGRES_PASSWORD}@postgres:5432/mathdoc
    MDC_ACTORS: ${MDC_ACTORS:?Set MDC_ACTORS to actor-token JSON}
    MDC_HOST: 0.0.0.0
    LEANGROUND_SERVER_URL: ${LEANGROUND_SERVER_URL:?Set LEANGROUND_SERVER_URL}
    LEANGROUND_FACT_TOKEN: ${LEANGROUND_FACT_TOKEN:?Set LEANGROUND_FACT_TOKEN}
    LEANGROUND_ACTOR: ${LEANGROUND_ACTOR:?Set LEANGROUND_ACTOR}
    MDC_TERMINUS_URL: ${MDC_TERMINUS_URL:-http://host.docker.internal:6363}
    MDC_TERMINUS_USER: ${MDC_TERMINUS_USER:-admin}
    MDC_TERMINUS_PASSWORD: ${MDC_TERMINUS_PASSWORD:-}
  extra_hosts:
    - host.docker.internal:host-gateway
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mathdoc
      POSTGRES_USER: mathdoc
      POSTGRES_PASSWORD: ${MDC_POSTGRES_PASSWORD:?Set MDC_POSTGRES_PASSWORD}
    volumes:
      - coordination-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathdoc -d mathdoc"]
      interval: 5s
      retries: 12
  migrate:
    <<: *coordination
    command: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *coordination
    command: ["serve"]
    restart: unless-stopped
    ports: ["127.0.0.1:${MDC_PORT:-17843}:17843"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    <<: *coordination
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 150s
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  coordination-data:
