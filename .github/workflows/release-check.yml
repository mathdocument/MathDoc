name: Release check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Check frontend
        run: npm run check
        working-directory: web

      - name: Test frontend
        run: npm test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Verify committed frontend assets
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git status --porcelain --untracked-files=all -- web/dist)"

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Check documentation
        run: npm run check
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test Rust
        run: cargo +stable test --locked

      - name: Start local TerminusDB
        env:
          MDC_TERMINUS_PASSWORD: local-ci-mathdoc
        run: docker compose up -d

      - name: Wait for TerminusDB
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:6363/api/ok; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Install native Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Test database and native Lean integration
        env:
          MDC_TERMINUS_PASSWORD: local-ci-mathdoc
        run: cargo test --locked --test test_database --test test_service --test test_lean_service --test test_status -- --ignored --nocapture

      - name: Install browser for integration tests
        run: npx playwright install --with-deps --no-shell chromium
        working-directory: web

      - name: Test browser with real backend
        env:
          MDC_TERMINUS_PASSWORD: local-ci-mathdoc
          MDC_E2E_ARTIFACTS: ${{ runner.temp }}/mdc-e2e-artifacts
        run: npm run test:e2e
        working-directory: web

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-diagnostics
          path: ${{ runner.temp }}/mdc-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  macos-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test macOS library and graph algorithms
        run: cargo +stable test --locked
