name: Release check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Check frontend
        run: npm run check
        working-directory: web

      - name: Test frontend
        run: npm test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Verify committed frontend assets
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git status --porcelain --untracked-files=all -- web/dist)"

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Check documentation
        run: npm run check
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test Rust
        run: cargo +stable test --locked

      - name: Install browser for integration tests
        run: npx playwright install --with-deps --no-shell chromium
        working-directory: web

      - name: Test browser with real backend
        run: npm run test:e2e
        working-directory: web

  macos-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test macOS filesystem and process implementations
        run: cargo +stable test --locked
