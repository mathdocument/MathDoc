name: Release check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    env:
      MDC_TERMINUS_PASSWORD: local-ci-mathdoc
      MDC_POSTGRES_PASSWORD: local-ci-mathdoc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check backend and prototype types
        run: npm run check

      - name: Check frontend
        run: npm run check -w mdc-web

      - name: Test frontend
        run: npm test -w mdc-web

      - name: Build backend and frontend
        run: npm run build -w @mathdoc/coordinator && npm run build -w mdc-web

      - name: Keep generated files out of Git
        run: test -z "$(git ls-files -- web/dist docs/dist coordinator/dist node_modules web/node_modules docs/node_modules)"

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Check documentation
        run: npm run check
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test LaTeX renderer
        run: |
          python -m pip install -r renderer/requirements.txt
          python -B -m unittest discover -s renderer -p 'test_*.py'

      - name: Start TerminusDB and PostgreSQL
        run: docker compose up -d

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:6363/api/ok && docker compose exec -T postgres pg_isready -U mathdoc >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      # Tests needing a LeanGround server (scenario, Mathlib) skip without MDC_TEST_LEANGROUND_URL.
      - name: Test backend with real databases
        env:
          MDC_TEST_DATABASE_URL: postgresql://mathdoc:local-ci-mathdoc@127.0.0.1:5432/mathdoc
          MDC_TEST_TERMINUS_URL: http://127.0.0.1:6363
          MDC_TEST_TERMINUS_PASSWORD: local-ci-mathdoc
        run: npm test

      - name: Install browser for integration tests
        run: npx playwright install --with-deps --no-shell chromium
        working-directory: web

      - name: Test browser with the real backend
        env:
          MDC_DATABASE_URL: postgresql://mathdoc:local-ci-mathdoc@127.0.0.1:5432/mathdoc
          MDC_TERMINUS_URL: http://127.0.0.1:6363
          MDC_LATEX_PYTHON: python3
          MDC_E2E_ARTIFACTS: ${{ runner.temp }}/mdc-e2e-artifacts
        run: npm run test:e2e -w mdc-web

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-diagnostics
          path: ${{ runner.temp }}/mdc-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build server runtime
        run: docker build -t mathdoc-runtime:local .
      - name: Test isolated Docker deployment
        run: python3 tests/docker-smoke.py
