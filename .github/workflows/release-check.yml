name: Release check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Check frontend
        run: npm run check
        working-directory: web

      - name: Test frontend
        run: npm test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Verify committed frontend assets
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git status --porcelain --untracked-files=all -- web/dist)"

      - name: Verify packaged VS Code extension
        working-directory: editors/vscode
        run: |
          version="$(node -p "require('./package.json').version")"
          archive="mdc-mdoc-${version}.vsix"
          test -f "$archive"
          cmp -s package.json <(unzip -p "$archive" extension/package.json)
          cmp -s LICENSE <(unzip -p "$archive" extension/LICENSE.txt)
          cmp -s language-configuration.json <(unzip -p "$archive" extension/language-configuration.json)
          cmp -s syntaxes/mdoc.tmLanguage.json <(unzip -p "$archive" extension/syntaxes/mdoc.tmLanguage.json)

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Check documentation
        run: npm run check
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test Rust
        run: cargo +stable test --locked
