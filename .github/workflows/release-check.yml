name: Release check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install LaTeX dependencies
        run: python -m pip install -r renderer/requirements.txt

      - name: Install Chromium system libraries
        run: npx --yes "playwright@$(node -p 'require("./package-lock.json").packages["web/node_modules/playwright"].version')" install-deps chromium

      # Tests that need a LeanGround server (scenario, Mathlib, collaboration e2e) skip here.
      - name: Run shared native checks
        env:
          MDC_LATEX_PYTHON: python3
          MDC_E2E_ARTIFACTS: ${{ runner.temp }}/mdc-e2e-artifacts
        run: ./scripts/check native

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-diagnostics
          path: ${{ runner.temp }}/mdc-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run shared container checks
        run: ./scripts/check docker
