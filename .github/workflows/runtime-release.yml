name: Publish runtime

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select image version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              if event["release"]["tag_name"] != f"v{version}":
                  raise SystemExit("Release tag must match the version in Cargo.toml")
              tag = version
          else:
              tag = "sha-" + os.environ["GITHUB_SHA"][:12]
          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/mathdoc-runtime"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"image={image}:{tag}", file=output)
          PY

      - name: Build Linux AMD64 runtime
        run: docker build -t mathdoc-runtime:local .

      - name: Verify source-free deployment before publishing
        run: python3 tests/docker-smoke.py

      - name: Publish the tested image
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag mathdoc-runtime:local "$IMAGE"
          docker push "$IMAGE"
          reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          case "$reference" in
            ghcr.io/*@sha256:*) ;;
            *) echo 'Published image digest is missing' >&2; exit 1 ;;
          esac
          printf 'image=%s\n' "$reference" >> "$GITHUB_OUTPUT"

      - name: Package deployment pinned to the published digest
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          ./scripts/package-deployment "$RUNNER_TEMP/mathdoc-deployment" "$IMAGE"
          tar -C "$RUNNER_TEMP/mathdoc-deployment" -czf "$RUNNER_TEMP/mathdoc-deployment-linux-amd64.tar.gz" .

      - uses: actions/upload-artifact@v6
        with:
          name: mathdoc-deployment-linux-amd64
          path: ${{ runner.temp }}/mathdoc-deployment-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Attach deployment bundle to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/mathdoc-deployment-linux-amd64.tar.gz"
