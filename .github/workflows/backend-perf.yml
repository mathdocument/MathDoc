name: Backend performance
on:
  pull_request:
    paths: ["src/**", "tests/test_service_scale.rs", "Cargo.*", "compose.yaml", ".github/workflows/backend-perf.yml"]
permissions:
  contents: read
jobs:
  graph-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MDC_TERMINUS_PASSWORD: local-ci-mathdoc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        run: npm ci && npm run build
        working-directory: web
      - run: docker compose up -d
      - run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:6363/api/ok; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Measure database-backed graph requests
        run: cargo test --release --locked --test test_service_scale -- --ignored --nocapture
