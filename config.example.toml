# Leave unset for localhost / SSH tunnel access.
# For LAN access, also change the host binding in compose.yaml to 0.0.0.0.
# public_origin = "http://192.0.2.10:17843"
# For an authenticated reverse proxy, use the browser's external site address:
# public_origin = "https://mathdoc.example.com"

# Per-branch Lean concurrency. Tune for the host/container CPU and memory budget.
# lean_cli_workers = 4
# lean_web_sessions = 4

# Combined shared Lean artifact budget across databases: 30 GiB by default.
# Automatic LRU collection targets 80% after exceeding this budget; 0 disables it.
# cache_max_bytes = 32_212_254_720
